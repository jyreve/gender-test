<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>나의 양성평등 지수 테스트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
/* Layout: 태블릿 가로 우선. 상단 제목+번호+탭(사전/사후/해석/교사용), 결과는 왼쪽 분석 · 오른쪽 오각형 그래프 2단 */
:root{
  --bg:#F5F6F1; --surface:#FFFFFF; --ink:#1C2523; --muted:#56625E; --line:#DCE0D8;
  --teal:#0E6B66; --tang:#D94E22; --teal-soft:#DCEEEC; --tang-soft:#FBE3D9; --sun-soft:#FBF0D3;
  --pre:#2F6FA8; --post:#D94E22; --on:#FFFFFF; --good:#2E7D4F; --warn:#B7791F;
  --e-respect:#0E6B66; --e-empathy:#D94E22; --e-chance:#A6740C; --e-choice:#2F6FA8; --e-free:#4E7F36;
  --f-display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-hand:"Gowun Dodum","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121816; --surface:#1B2320; --ink:#E9EEEA; --muted:#A3AEA9; --line:#2E3934;
  --teal:#4FB7AE; --tang:#F07C55; --teal-soft:#183331; --tang-soft:#3A2219; --sun-soft:#352C16;
  --pre:#6AAEE0; --post:#F07C55; --on:#0E1513; --good:#6CC28F; --warn:#E2B54A;
  --e-respect:#4FB7AE; --e-empathy:#F07C55; --e-chance:#E2B54A; --e-choice:#6AAEE0; --e-free:#86C06F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121816; --surface:#1B2320; --ink:#E9EEEA; --muted:#A3AEA9; --line:#2E3934;
  --teal:#4FB7AE; --tang:#F07C55; --teal-soft:#183331; --tang-soft:#3A2219; --sun-soft:#352C16;
  --pre:#6AAEE0; --post:#F07C55; --on:#0E1513; --good:#6CC28F; --warn:#E2B54A;
  --e-respect:#4FB7AE; --e-empathy:#F07C55; --e-chance:#E2B54A; --e-choice:#6AAEE0; --e-free:#86C06F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;word-break:keep-all;margin:0}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:14px 24px;display:grid;gap:12px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.2;margin:0;text-wrap:balance}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tang);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.title-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header.top h1{font-size:clamp(26px,3.2vw,38px)}
header.top h1 span{color:var(--tang)}
.who{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px;font-size:15px}
.who b{font-family:var(--f-display);font-weight:400;font-size:19px}
.who button{border:0;background:var(--bg);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px}
.tabs button{border:0;background:none;border-radius:999px;padding:8px 16px;cursor:pointer;font-family:var(--f-display);font-size:18px;color:var(--muted);display:flex;align-items:center;gap:7px}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs .done{width:8px;height:8px;border-radius:50%;background:var(--teal)}
.tabs button[aria-selected="true"] .done{background:var(--bg)}
.tabs svg{width:14px;height:14px}
.conn{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--warn)}
.conn.on i{background:var(--good)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 26px;display:grid;gap:12px;align-content:start;min-width:0}
.btn{border:0;border-radius:999px;padding:12px 22px;cursor:pointer;font-weight:700;background:var(--ink);color:var(--bg);font-size:16px}
.btn.accent{background:var(--tang);color:var(--on)}
.btn.send{background:var(--teal);color:var(--on)}
.btn.alt{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:7px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sent{background:var(--teal-soft);color:var(--teal);opacity:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--teal)}
.muted{color:var(--muted)}
.note{font-size:14px;background:var(--sun-soft);border-radius:12px;padding:10px 14px}

/* number select */
.pick{max-width:860px;width:100%;margin:0 auto;text-align:center;justify-items:center;gap:18px;padding-block:28px}
.pick h2{font-size:clamp(30px,3.6vw,42px)}
.numgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;width:100%}
.numgrid button{border:2px solid var(--line);background:var(--bg);border-radius:18px;padding:18px 6px;cursor:pointer;font-family:var(--f-display);font-size:30px;display:grid;gap:2px;justify-items:center}
.numgrid button small{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.numgrid button:hover,.numgrid button.sel{border-color:var(--tang);background:var(--tang-soft)}

/* intro */
.intro{grid-template-columns:1.2fr 1fr;align-items:center;gap:28px}
.intro h2{font-size:clamp(30px,3.6vw,44px)}
.rules{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rules li{display:flex;gap:12px;align-items:flex-start}
.rules li b{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center;font-size:14px}
.intro-side{background:var(--bg);border-radius:18px;padding:20px;display:grid;gap:10px}
.intro-side .el-chip{display:flex;gap:10px;align-items:baseline}
.intro-side .el-chip b{color:var(--c);font-family:var(--f-display);font-weight:400;font-size:20px;min-width:44px}

/* question */
.qcard{max-width:860px;width:100%;margin:0 auto}
.meta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tang);transition:width .3s}
.qtext{font-family:var(--f-hand);font-size:clamp(22px,2.6vw,28px);line-height:1.55;min-height:3.4em;padding-block:6px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.opt{display:grid;justify-items:center;gap:8px;text-align:center;border:2px solid var(--line);background:var(--bg);border-radius:18px;padding:18px 8px;cursor:pointer;font-size:16px}
.opt .dot{border-radius:50%;background:var(--tang);width:calc(12px + var(--n) * 6px);height:calc(12px + var(--n) * 6px);opacity:calc(.3 + var(--n) * .23)}
.opt .dotbox{height:32px;display:grid;place-items:center}
.opt:hover,.opt.sel{border-color:var(--tang);background:var(--tang-soft)}

/* result */
.result{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.score-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.score{font-family:var(--f-display);font-size:72px;line-height:1;color:var(--tang);font-variant-numeric:tabular-nums}
.score small{font-size:24px;color:var(--muted)}
.type h2{font-size:30px}
.type p{color:var(--muted);font-size:15px}
.change{font-size:15px;background:var(--sun-soft);border-radius:12px;padding:10px 14px}
.analysis{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.analysis li{display:grid;grid-template-columns:86px 1fr;gap:10px;font-size:15px;align-items:baseline}
.analysis li b{font-size:13px;color:var(--muted);font-weight:700}
.rethink{display:grid;gap:8px;max-height:170px;overflow:auto;padding-right:4px}
details.item{border:1px solid var(--line);border-radius:14px;background:var(--bg);padding:10px 14px}
details.item summary{cursor:pointer;list-style:none;display:flex;gap:10px;align-items:flex-start}
details.item summary::-webkit-details-marker{display:none}
.tag{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--on);background:var(--c);border-radius:999px;padding:1px 9px;margin-top:3px}
details.item summary span.t{font-family:var(--f-hand);font-size:15px}
details.item .ex{margin-top:8px;display:grid;gap:6px;font-size:14px}
details.item .ex .q{background:var(--teal-soft);border-radius:10px;padding:8px 12px}
.sendbox{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--teal-soft);border-radius:16px;padding:12px 14px}
.sendbox p{font-size:14px;flex:1;min-width:200px}
.chart{justify-items:center}
.chart svg{width:100%;max-width:430px;height:auto;display:block}
.legend{display:flex;gap:18px;font-size:14px;color:var(--muted);justify-content:center}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:22px;height:0;border-top:3px solid var(--c)}
.legend i.dash{border-top-style:dashed}
.scores5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%}
.scores5 div{text-align:center;background:var(--bg);border-radius:12px;padding:8px 4px;border-top:4px solid var(--c)}
.scores5 b{display:block;font-size:13px;color:var(--c)}
.scores5 span{font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.scores5 small{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.k-respect{--c:var(--e-respect)} .k-empathy{--c:var(--e-empathy)} .k-chance{--c:var(--e-chance)} .k-choice{--c:var(--e-choice)} .k-free{--c:var(--e-free)}

/* guide */
.guide-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.guide-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.gcard{border-top:6px solid var(--c)}
.gcard .gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.gcard h3{font-size:28px;color:var(--c)}
.gcard .mine{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.gcard .flag{font-size:12px;font-weight:700;background:var(--tang);color:var(--on);border-radius:999px;padding:2px 10px}
.gcard .flag.ok{background:var(--teal)}
.gcard ul{margin:0;padding-left:1.1em;display:grid;gap:4px;font-size:15px}
.gcard .sub{font-size:13px;font-weight:700;color:var(--muted)}
.gcard .scene{font-family:var(--f-hand);font-size:15px;background:var(--bg);border-radius:12px;padding:10px 14px}
.gcard.low{box-shadow:0 0 0 2px var(--tang)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.levels div{background:var(--bg);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.levels b{font-family:var(--f-display);font-weight:400;font-size:20px}
.levels small{font-size:13px;color:var(--muted)}

/* teacher */
.lock{max-width:440px;width:100%;margin:40px auto 0;text-align:center;justify-items:center;gap:14px}
.lock h2{font-size:32px}
.lock input{width:220px;text-align:center;font-size:28px;letter-spacing:12px;border:2px solid var(--line);border-radius:14px;padding:10px;background:var(--bg)}
.lock .err{color:var(--tang);font-size:14px;min-height:1.4em}
.t-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;gap:2px}
.tile small{font-size:13px;color:var(--muted);font-weight:700}
.tile b{font-family:var(--f-display);font-weight:400;font-size:40px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.tile.hi{background:var(--ink);border-color:var(--ink)}
.tile.hi small,.tile.hi span{color:var(--bg);opacity:.8}
.tile.hi b{color:var(--bg)}
.t-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:13px;color:var(--muted);font-weight:700}
td.num,th.num{text-align:right}
.up{color:var(--good);font-weight:700}
.down{color:var(--tang);font-weight:700}
.miss{color:var(--muted);font-size:13px}
.tbl-wrap{overflow-x:auto}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
tr.on td{background:var(--teal-soft)}
.toplist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.toplist li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;font-size:14px;background:var(--bg);border-radius:12px;padding:10px 12px}
.toplist li span.t{font-family:var(--f-hand);font-size:15px}
.detail{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center}

@media (max-width:820px){
  .intro,.result,.t-grid,.detail{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr 1fr}
  .levels{grid-template-columns:1fr 1fr}
  .numgrid{grid-template-columns:repeat(4,1fr)}
  .tiles{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

/* ---------- 점수 ---------- */
const itemScore = (q, v) => q.rev ? 3 - v : v;
function calc(a){
  const per = {}; ORDER.forEach(k => per[k] = 0);
  let tot = 0;
  Q.forEach((q, i) => { const s = itemScore(q, a[i]); tot += s; per[q.e] += s; });
  const pct = {}; ORDER.forEach(k => pct[k] = Math.round(per[k] / 12 * 100));
  return { score: Math.round(tot / 60 * 100), pct };
}
const typeOf = s => [...TYPES].reverse().find(x => s >= x[0]);
const validAns = a => Array.isArray(a) && a.length === Q.length && a.every(v => v >= 0 && v <= 3);
const sid = n => 's' + String(n).padStart(2, '0');

let db = null, online = false, remote = {};
const LOCAL_REMOTE = 'gef-class21-offline';   // Firebase에 연결되지 않을 때 대신 쓰는 저장소
function setConn(state){
  const c = $('#conn'); c.className = 'conn' + (state === 'on' ? ' on' : '');
  c.querySelector('span').textContent = state === 'on' ? '선생님 화면과 연결됨' : state === 'wait' ? '연결 중' : '연결 안 됨 · 이 기기에만 저장';
}
function initDB(){
  try {
    if (!window.firebase || !firebase.firestore) throw new Error('no sdk');
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    setConn('wait');
    db.collection(COL).onSnapshot(snap => {
      const next = {}; snap.forEach(d => next[d.id] = d.data());
      remote = next; online = true; setConn('on');
      if (mode !== 'quiz' && !(tab === 'teacher' && !teacherOpen)) safeRender();
    }, () => { online = false; setConn('off'); fallback(); });
  } catch(e){ setConn('off'); fallback(); }
}
function fallback(){ db = null; remote = store.get(LOCAL_REMOTE, {}); if (mode !== 'quiz' && !(tab === 'teacher' && !teacherOpen)) safeRender(); }
async function sendResult(n, phase, a){
  const r = calc(a);
  const data = { [phase]: { ans: a.slice(), score: r.score, pct: r.pct } };
  if (db) { await db.collection(COL).doc(sid(n)).set(data, { merge: true }); }
  else { const all = store.get(LOCAL_REMOTE, {}); all[sid(n)] = Object.assign(all[sid(n)] || {}, data); store.set(LOCAL_REMOTE, all); remote = all; }
}
async function deleteResult(n, phase){
  if (db) { await db.collection(COL).doc(sid(n)).set({ [phase]: firebase.firestore.FieldValue.delete() }, { merge: true }); }
  else { const all = store.get(LOCAL_REMOTE, {}); if (all[sid(n)]) delete all[sid(n)][phase]; store.set(LOCAL_REMOTE, all); remote = all; }
}
const sentAns = (n, phase) => { const d = remote[sid(n)]; return d && d[phase] && validAns(d[phase].ans) ? d[phase].ans : null; };

function localAns(n, phase){ const all = store.get(LOCAL_KEY, {}); const v = all[sid(n)] && all[sid(n)][phase]; return validAns(v) ? v : null; }
function setLocal(n, phase, a){ const all = store.get(LOCAL_KEY, {}); all[sid(n)] = all[sid(n)] || {}; if (a) all[sid(n)][phase] = a; else delete all[sid(n)][phase]; store.set(LOCAL_KEY, all); }

/* ---------- 문항 ---------- */
function question(){
  const q = Q[qi];
  $('#view').innerHTML = `<section class="card qcard">
    <div class="meta"><span>${num}번 · ${PHASE_NAME[tab]} 테스트 · ${qi + 1} / ${Q.length}</span><span>${Math.round(qi / Q.length * 100)}%</span></div>
    <div class="bar"><i style="width:${qi / Q.length * 100}%"></i></div>
    <p class="qtext">${esc(q.t)}</p>
    <div class="opts">${LAB.map((l, i) => `<button type="button" class="opt ${ans[qi] === i ? 'sel' : ''}" data-v="${i}" style="--n:${i}"><span class="dotbox"><span class="dot"></span></span>${l}</button>`).join('')}</div>
    <div class="row"><button class="btn alt" id="back" type="button" ${qi === 0 ? 'disabled' : ''}>이전 문항</button><button class="btn alt" id="quit" type="button">그만하기</button></div>
  </section>`;
  $('#view .opts').addEventListener('click', ev => {
    const b = ev.target.closest('.opt'); if (!b) return;
    ans[qi] = +b.dataset.v;

    else { setLocal(num, tab, ans.slice()); mode = 'auto'; render(); }
  });
  $('#back').addEventListener('click', () => { if (qi > 0) { qi--; question(); } });
  $('#quit').addEventListener('click', () => { mode = 'auto'; render(); });
}

/* ---------- 오각형 그래프 ---------- */
function radar(series, label){
  const W = 440, H = 400, cx = 220, cy = 205, R = 140;
  const ang = i => (-90 + i * 72) * Math.PI / 180;
  const pt = (i, v) => [cx + Math.cos(ang(i)) * R * v / 100, cy + Math.sin(ang(i)) * R * v / 100];
  let g = '';
  [25, 50, 75, 100].forEach(l => { g += `<polygon points="${ORDER.map((_, i) => pt(i, l).join(',')).join(' ')}" fill="none" style="stroke:var(--line)" stroke-width="${l === 100 ? 2 : 1}"/>`; });
  ORDER.forEach((_, i) => { const [x, y] = pt(i, 100); g += `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke:var(--line)" stroke-width="1"/>`; });
  [50, 100].forEach(l => { const [x, y] = pt(0, l); g += `<text x="${x + 6}" y="${y + 4}" font-size="11" style="fill:var(--muted)">${l}</text>`; });
  series.forEach(s => {
    const pts = ORDER.map((k, i) => pt(i, Math.max(s.pct[k], 2)).join(',')).join(' ');
    g += `<polygon points="${pts}" style="fill:${s.fill ? s.color : 'none'};fill-opacity:${s.fill ? .22 : 0};stroke:${s.color}" stroke-width="3" ${s.dash ? 'stroke-dasharray="7 6"' : ''} stroke-linejoin="round"/>`;
    if (!s.dash) ORDER.forEach((k, i) => { const [x, y] = pt(i, Math.max(s.pct[k], 2)); g += `<circle cx="${x}" cy="${y}" r="5" style="fill:${s.color}"/>`; });
  });
  const main = series[series.length - 1];
  ORDER.forEach((k, i) => {
    const [x, y] = pt(i, 122);
    const anchor = Math.abs(x - cx) < 10 ? 'middle' : x > cx ? 'start' : 'end';
    g += `<text x="${x}" y="${y - 2}" text-anchor="${anchor}" font-size="18" style="fill:var(--e-${k});font-family:var(--f-display)">${EL[k].name}</text>`;
    g += `<text x="${x}" y="${y + 17}" text-anchor="${anchor}" font-size="14" style="fill:var(--ink);font-weight:700">${main.pct[k]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label || '5가지 평등 힘 오각형 그래프'}">${g}</svg>`;
}
function legendHTML(){ return `<div class="legend"><span style="--c:var(--pre)"><i class="dash"></i>사전</span><span style="--c:var(--post)"><i></i>사후</span></div>`; }

/* ---------- 학생 결과 ---------- */
function result(which, a){
  const r = calc(a), t = typeOf(r.score);
  const isPost = which === 'post';
  const preA = isPost ? myAns(num, 'pre') : null;
  const pre = preA ? calc(preA) : null;
  const sorted = ORDER.slice().sort((x, y) => r.pct[y] - r.pct[x]);
  const strong = sorted[0], weak = sorted[4];
  const gap = r.pct[strong] - r.pct[weak];
  const rethink = Q.map((q, i) => ({ q, i, s: itemScore(q, a[i]) })).filter(x => x.s <= 1);
  let changeLine = '';
  if (pre) {
    const d = r.score - pre.score;
    const up = ORDER.map(k => [k, r.pct[k] - pre.pct[k]]).sort((x, y) => y[1] - x[1])[0];
    changeLine = `<p class="change">사전 ${pre.score}점 → 사후 ${r.score}점 · ${d > 0 ? `<b>${d}점 올랐어요.</b>` : d < 0 ? `${-d}점 내려갔어요. 더 솔직하고 예민하게 보게 된 걸 수도 있어요.` : '같은 점수예요.'}${up[1] > 0 ? ` 가장 많이 자란 힘은 <b>${EL[up[0]].name}</b>(+${up[1]})이에요.` : ''}</p>`;
  }
  const balance = gap >= 34 ? `힘의 차이가 커요(${gap}점). ${EL[weak].name}을 키우면 오각형이 훨씬 고르게 펴져요.`
                : gap >= 17 ? `대체로 고르지만 ${EL[weak].name}이 조금 낮아요.` : '다섯 가지 힘이 고르게 자라 있어요.';
  const series = pre ? [{ pct: pre.pct, color: 'var(--pre)', dash: true }, { pct: r.pct, color: 'var(--post)', fill: true }]
                     : [{ pct: r.pct, color: isPost ? 'var(--post)' : 'var(--pre)', fill: true }];
  const sent = isSent(num, which);
  const hadOld = !!sentAns(num, which) && !sent;
  $('#view').innerHTML = `<div class="result">
    <section class="card">
      <span class="eyebrow">${CLASS_NAME} ${num}번 · ${PHASE_NAME[which]} 테스트 종합 분석</span>
      <div class="score-wrap">
        <div class="score">${r.score}<small>점</small></div>
        <div class="type"><h2>${t[1]}</h2><p>${t[2]}</p></div>
      </div>
      ${changeLine}
      <div class="sendbox">
        <p>${sent ? '선생님께 보냈어요. 다시 테스트하고 보내면 새 결과로 바뀌어요.' : hadOld ? '새 결과예요. 보내면 선생님 화면의 이전 결과가 지워지고 이 결과로 바뀌어요.' : '결과를 확인했다면 선생님께 보내 주세요.'}</p>
        <button class="btn ${sent ? 'sent' : 'send'}" id="send" type="button" ${sent || sending ? 'disabled' : ''}>${sent ? '전송 완료 ✓' : sending ? '보내는 중…' : hadOld ? '선생님께 다시 보내기' : '선생님께 보내기'}</button>
      </div>
      <ul class="analysis">
        <li><b>가장 강한 힘</b><span><b style="color:var(--e-${strong})">${EL[strong].name} ${r.pct[strong]}점</b> · ${EL[strong].desc}</span></li>
        <li><b>더 키울 힘</b><span><b style="color:var(--e-${weak})">${EL[weak].name} ${r.pct[weak]}점</b> · ${EL[weak].desc}</span></li>
        <li><b>균형</b><span>${balance}</span></li>
      </ul>
      <h3 style="font-size:20px">다시 생각해 볼 문항 ${rethink.length}개</h3>
      ${rethink.length ? `<div class="rethink">${rethink.map(x => `<details class="item k-${x.q.e}"><summary><span class="tag">${EL[x.q.e].name}</span><span class="t">${esc(x.q.t)}</span></summary>
        <div class="ex"><p class="muted">내 답: ${LAB[a[x.i]]}</p><p>${esc(x.q.ex)}</p><p class="q">생각 질문 · ${esc(x.q.q)}</p></div></details>`).join('')}</div>`
        : '<p class="muted">모든 문항에서 평등한 관점을 골랐어요. 이제 이 생각을 친구들과 나눠 보세요.</p>'}
      <div class="row">
        <button class="btn accent" type="button" data-go="guide">${EL[weak].name} 결과 해석 보기</button>
        ${!isPost ? '<button class="btn alt" type="button" data-go="post">사후 테스트로</button>' : ''}
        <button class="btn alt" type="button" id="redo">다시 하기</button>
      </div>
    </section>
    <section class="card chart">
      <span class="eyebrow">5가지 평등 힘</span>
      ${radar(series)}
      ${pre ? legendHTML() : ''}
      <div class="scores5">${ORDER.map(k => `<div class="k-${k}"><b>${EL[k].name}</b><span>${r.pct[k]}</span>${pre ? `<small>${r.pct[k] - pre.pct[k] >= 0 ? '+' : ''}${r.pct[k] - pre.pct[k]}</small>` : ''}</div>`).join('')}</div>
    </section>
  </div>`;
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  $('#redo').addEventListener('click', () => { mode = 'intro'; intro(); });
  $('#send').addEventListener('click', async () => {
    if (sending) return; sending = true; result(which, a);
    try { await sendResult(num, which, a); setLocal(num, which, a); }
    catch(e){ alertBox('보내지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.'); }
    sending = false; render();
  });
}

/* ---------- 교사용 ---------- */
function teacher(){
  if (!teacherOpen) return lockScreen();
  const rows = NUMS.map(n => {
    const pa = sentAns(n, 'pre'), qa = sentAns(n, 'post');
    return { n, pre: pa ? calc(pa) : null, post: qa ? calc(qa) : null, preA: pa, postA: qa };
  });
  const preRows = rows.filter(r => r.pre), postRows = rows.filter(r => r.post), both = rows.filter(r => r.pre && r.post);
  const avg = arr => arr.length ? Math.round(arr.reduce((s, v) => s + v, 0) / arr.length) : null;
  const avgPct = (list, ph) => { const o = {}; ORDER.forEach(k => o[k] = avg(list.map(r => r[ph].pct[k]))); return o; };
  const preAvg = avg(preRows.map(r => r.pre.score)), postAvg = avg(postRows.map(r => r.post.score));
  const riseAvg = both.length ? Math.round(both.reduce((s, r) => s + (r.post.score - r.pre.score), 0) / both.length * 10) / 10 : null;
  const upCount = both.filter(r => r.post.score > r.pre.score).length;
  const prePct = preRows.length ? avgPct(preRows, 'pre') : null;
  const postPct = postRows.length ? avgPct(postRows, 'post') : null;
  const bothPre = both.length ? avgPct(both, 'pre') : null, bothPost = both.length ? avgPct(both, 'post') : null;

  // 학급이 가장 헷갈린 문항 (사후가 있으면 사후, 없으면 사전 기준)

  const fmtD = d => d == null ? '' : `<span class="${d > 0 ? 'up' : d < 0 ? 'down' : ''}">${d > 0 ? '+' : ''}${d}</span>`;
  const series = [];

  const pick = pickedStudent ? rows.find(r => r.n === pickedStudent) : null;
  const detail = pick ? (() => {
    const s = [];
    if (pick.pre) s.push({ pct: pick.pre.pct, color: 'var(--pre)', dash: !!pick.post, fill: !pick.post });

        <table><tr><th>힘</th><th class="num">사전</th><th class="num">사후</th><th class="num">변화</th></tr>
        ${ORDER.map(k => `<tr><td style="color:var(--e-${k});font-weight:700">${EL[k].name}</td><td class="num">${pick.pre ? pick.pre.pct[k] : '-'}</td><td class="num">${pick.post ? pick.post.pct[k] : '-'}</td><td class="num">${pick.pre && pick.post ? fmtD(pick.post.pct[k] - pick.pre.pct[k]) : ''}</td></tr>`).join('')}</table>

      <div class="tile"><small>사전 평균</small><b>${preAvg ?? '-'}</b><span>점</span></div>
      <div class="tile"><small>사후 평균</small><b>${postAvg ?? '-'}</b><span>점</span></div>
      <div class="tile hi"><small>평균 상승</small><b>${riseAvg == null ? '-' : (riseAvg > 0 ? '+' : '') + riseAvg}</b><span>${both.length ? `사전·사후 모두 낸 ${both.length}명 기준 · ${upCount}명 상승` : '사전·사후 모두 낸 학생이 아직 없어요'}</span></div>
    </div>
    ${detail}
    <div class="t-grid">
      <section class="card chart">
        <span class="eyebrow">학급 평균 5가지 평등 힘</span>
        ${series.length ? radar(series, '학급 평균 오각형 그래프') + (prePct && postPct ? legendHTML() : '') : '<p class="muted" style="padding:40px 0">학생들이 결과를 보내면 여기에 학급 평균 오각형이 그려져요.</p>'}
        ${bothPre ? `<table><tr><th>힘</th><th class="num">사전</th><th class="num">사후</th><th class="num">변화</th></tr>
          ${ORDER.map(k => `<tr><td style="color:var(--e-${k});font-weight:700">${EL[k].name}</td><td class="num">${bothPre[k]}</td><td class="num">${bothPost[k]}</td><td class="num">${fmtD(bothPost[k] - bothPre[k])}</td></tr>`).join('')}</table>
          <p class="muted" style="font-size:13px">변화 표는 사전·사후를 모두 낸 ${both.length}명 기준이에요.</p>` : ''}
      </section>
      <section class="card">
        <span class="eyebrow">번호별 결과 · 누르면 상세 보기</span>
        <div class="tbl-wrap"><table>
          <tr><th>번호</th><th class="num">사전</th><th class="num">사후</th><th class="num">변화</th><th>더 키울 힘</th></tr>
          ${rows.map(r => {
            const last = r.post || r.pre;
            const weak = last ? ORDER.slice().sort((x, y) => last.pct[x] - last.pct[y])[0] : null;
            return `<tr class="click ${pickedStudent === r.n ? 'on' : ''}" data-s="${r.n}"><td><b>${r.n}번</b></td>
              <td class="num">${r.pre ? r.pre.score : '<span class="miss">미제출</span>'}</td>
              <td class="num">${r.post ? r.post.score : '<span class="miss">미제출</span>'}</td>
              <td class="num">${r.pre && r.post ? fmtD(r.post.score - r.pre.score) : ''}</td>
              <td>${weak ? `<span style="color:var(--e-${weak});font-weight:700">${EL[weak].name}</span>` : ''}</td></tr>`;
          }).join('')}
        </table></div>
        ${hard.length ? `<span class="eyebrow" style="margin-top:6px">학급이 가장 헷갈린 문항 (${PHASE_NAME[basePh]} 기준)</span>
          <ul class="toplist">${hard.map(h => `<li class="k-${h.q.e}"><span class="tag">${EL[h.q.e].name}</span><span class="t">${esc(h.q.t)}</span><span class="muted">${Math.round(h.m / 3 * 100)}점</span></li>`).join('')}</ul>
          <p class="muted" style="font-size:13px">수업에서 토론 주제로 쓰기 좋아요. 점수는 그 문항의 학급 평균(100점 기준)이에요.</p>` : ''}
      </section>
    </div>`;
  $('#lockBtn').addEventListener('click', () => { teacherOpen = false; sess.set('gef-teacher', null); pickedStudent = null; render(); });
  document.querySelectorAll('[data-s]').forEach(tr => tr.addEventListener('click', () => { pickedStudent = +tr.dataset.s; confirmDel = null; teacher(); window.scrollTo({ top: 0, behavior: 'smooth' }); }));
  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => { pickedStudent = null; confirmDel = null; teacher(); }));
  document.querySelectorAll('[data-cancel]').forEach(b => b.addEventListener('click', () => { confirmDel = null; teacher(); }));
  document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
    const p = b.dataset.del;
    if (!b.dataset.yes) { confirmDel = p; return teacher(); }
    confirmDel = null;
    try { await deleteResult(pickedStudent, p); } catch(e){ alertBox('지우지 못했어요. 인터넷 연결을 확인해 주세요.'); }
    teacher();
  }));
}
function lockScreen(){
  $('#view').innerHTML = `<section class="card lock">
    ${LOCK_ICON.replace('<svg', '<svg style="width:40px;height:40px;color:var(--teal)"')}
    <h2>교사용 화면</h2>
    <p class="muted">암호를 입력하면 학급 전체 결과를 볼 수 있어요.</p>
    <form id="pinForm" class="row" style="justify-content:center">
      <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" aria-label="암호">
      <button class="btn accent" type="submit">열기</button>
    </form>
    <p class="err" id="pinErr"></p>
  </section>`;
  const pin = $('#pin');
  try { pin.focus(); } catch(e){}
  const tryOpen = (fromTyping) => {
    const v = String(pin.value || '').replace(/\D/g, '');
    if (v === TEACHER_PIN) {
      teacherOpen = true; sess.set('gef-teacher', '1');
      try { teacher(); } catch(e){ showError(e); }
      return true;
    }
    if (!fromTyping) { $('#pinErr').textContent = '암호가 맞지 않아요. 다시 입력해 주세요.'; pin.value = ''; try { pin.focus(); } catch(e){} }
    return false;
  };
  pin.addEventListener('input', () => { $('#pinErr').textContent = ''; if (String(pin.value).replace(/\D/g, '').length >= TEACHER_PIN.length) tryOpen(true); });
  $('#pinForm').addEventListener('submit', e => { e.preventDefault(); tryOpen(false); });
}

const h = (location.hash || '').slice(1);
tab = ['pre','post','guide','teacher'].includes(h) ? h : 'pre';
setConn('wait');
initDB();
safeRender();
})();
</script>

</body>
</html>
